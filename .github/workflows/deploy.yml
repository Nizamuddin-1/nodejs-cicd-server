name: NodeJS CICD Deployment using GitHub Actions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/nodejs-cicd-server
            git fetch origin main
            git reset --hard origin/main
            npm install
            
            # Restart or start PM2 process properly
            pm2 restart "nodejs-app" --update-env || pm2 start index.js --name "nodejs-app"
            pm2 save